baseURL = 'https://example.org/'
locale = 'en-us'
title = 'João Vieira'
theme = 'loficode-hugo-theme'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup.goldmark.renderer]
  unsafe = true

# Enable emoji support
enableEmoji = true

# Output formats for SPA functionality
[outputs]
  home = ["HTML", "JSON", "pages"]
  page = ["HTML"]
  section = ["HTML"]


# Custom output formats
[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
  [outputFormats.pages]
    mediaType = "application/json"
    baseName = "pages"
    isPlainText = true

# Pagination
[pagination]
  pagerSize = 6
  path = "page"

[params]
#  description = "A cozy example site showcasing the LofiCode Hugo theme"
  tagline = "Software Developer & Folklorist"

  # Profile section
  [params.author]
    name = "João Vieira"
    image = "images/profile.png"

  # Social links - Supported platforms: github, twitter, linkedin, email, mastodon, youtube, instagram, facebook
  [params.social]
    github = "https://github.com/joaovieira1428"
    # twitter = "https://twitter.com/example"
     linkedin = "https://linkedin.com/in/joão-vieira-80991218a"
     email = "joaofilipevieira1998@gmail.com"
    # mastodon = "https://mastodon.social/@example"
    # youtube = "https://youtube.com/@example"
    # instagram = "https://instagram.com/example"
    # facebook = "https://facebook.com/example"

# Main navigation menu
[[menu.main]]
  name = "Résumé"
  url = "/resume/"
  weight = 10

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 20


[[menu.main]]
  name = "Folk"
  url = "/folk/"
  weight = 30